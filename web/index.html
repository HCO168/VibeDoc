<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeDoc</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --border: #dfe3e8; --text: #1d2329; --muted: #66707a; --accent: #2f6fde; --accent-bg: #e8f0fd;
  --new: #6b7280; --new-bg: #f1f2f4; --confirm: #7c3aed; --confirm-bg: #f2ecfe; --doing: #2563eb; --doing-bg: #e8f0fe;
  --modified: #c2410c; --modified-bg: #fff1e6; --done: #15803d; --done-bg: #e8f6ec; --parked: #8a8f98; --danger: #c62828;
  --warn: #b45309;
  font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15181c; --panel: #1d2126; --panel-2: #252a30; --border: #333a42; --text: #e6e9ec; --muted: #9aa3ad; --accent: #6ea0ff; --accent-bg: #1f2c44;
    --new: #a3aab3; --new-bg: #2a2f35; --confirm: #b794f6; --confirm-bg: #2d2540; --doing: #7aa7ff; --doing-bg: #1f2b44;
    --modified: #ff9a5c; --modified-bg: #3a2618; --done: #5fd38a; --done-bg: #1b3326; --parked: #7d848c; --danger: #ff7a7a; --warn: #f3b25b;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.small { padding: 2px 8px; font-size: 12px; }
button.graph-btn { padding: 1px 5px; line-height: 0; color: var(--muted); }
button.graph-btn:hover { color: var(--accent); }
.focus-up { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
input, select, textarea { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
textarea { width: 100%; min-height: 160px; resize: vertical; line-height: 1.6; }
code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
header { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
.tabs { display: flex; gap: 2px; background: var(--panel-2); border-radius: 8px; padding: 2px; }
.tabs button { border: 0; background: transparent; }
.tabs button.on { background: var(--panel); box-shadow: 0 0 0 1px var(--border); }
.spacer { flex: 1; }
.repo-name { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 4px; }
.live { font-size: 12px; color: var(--muted); }
.live.ok::before { content: "●"; color: var(--done); margin-right: 4px; }
main { padding: 14px 16px 40px; }
.chips { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.chip { border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.chip.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.board { display: grid; grid-template-columns: repeat(5, minmax(140px, 1fr)); gap: 10px; overflow-x: auto; }
.col { background: var(--panel-2); border-radius: 10px; padding: 8px; min-height: 120px; }
.col h3 { display: flex; align-items: center; gap: 6px; margin: 2px 4px 8px; font-size: 13px; }
.col h3 .n { margin-left: auto; color: var(--muted); font-weight: 400; }
.col.modified { background: var(--modified-bg); }
.col.modified h3 { color: var(--modified); }
.col.drop { outline: 2px dashed var(--accent); }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
.card:hover { border-color: var(--accent); }
.card .id { font-size: 11px; color: var(--muted); display: flex; gap: 6px; }
.card .t { margin: 3px 0; line-height: 1.4; }
.card .m { font-size: 11px; color: var(--muted); }
.card.modified { border-color: var(--modified); }
.tag { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 5px; background: var(--panel-2); color: var(--muted); }
.st { display: inline-block; font-size: 12px; border-radius: 4px; padding: 1px 7px; }
.st.new { background: var(--new-bg); color: var(--new); } .st.confirm { background: var(--confirm-bg); color: var(--confirm); }
.st.doing { background: var(--doing-bg); color: var(--doing); } .st.modified { background: var(--modified-bg); color: var(--modified); }
.st.done { background: var(--done-bg); color: var(--done); } .st.parked { background: var(--panel-2); color: var(--parked); }
.st.released { background: var(--done); color: var(--panel); }
.doc { max-width: 860px; line-height: 1.75; font-size: 14px; cursor: text; }
.doc .doc-h1 { font-size: 20px; margin: 4px 0 10px; }
.doc .doc-h2 { font-size: 16px; margin: 22px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.doc .doc-h3 { font-size: 14px; margin: 14px 0 2px; display: flex; gap: 8px; align-items: center; }
.doc p { margin: 0 0 6px; white-space: pre-line; }
.doc blockquote { margin: 0 0 8px; padding: 2px 10px; border-left: 3px solid var(--border); color: var(--muted); }
.doc ul, .doc ol { margin: 0 0 8px; padding-left: 22px; }
.doc code { background: var(--panel-2); border-radius: 4px; padding: 0 4px; }
.doc .st { border: 0; cursor: pointer; font-weight: 400; }
.doc-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.doc-editor { width: 100%; min-height: 60vh; resize: vertical; line-height: 1.7; font-size: 13px; padding: 12px 14px; tab-size: 2; }
.feat-link { display: flex; gap: 8px; align-items: baseline; padding: 7px 4px; border-bottom: 1px solid var(--border); cursor: pointer; flex-wrap: wrap; }
.feat-link:hover { background: var(--accent-bg); }
.feat-link .t { font-weight: 600; }
.feat-link .st { border: 0; cursor: pointer; }
.fid { color: var(--muted); font-size: 11px; }
.mods button.dim { color: var(--muted); }
.parked-area { margin-top: 12px; background: var(--panel-2); border-radius: 10px; padding: 8px 12px; }
.parked-area summary { cursor: pointer; color: var(--muted); }
.parked-area .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin-top: 8px; }
.empty { color: var(--muted); font-size: 12px; padding: 8px 4px; }
.map { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 14px; }
.mods { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 6px; align-self: start; position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; }
.mods button { display: flex; width: 100%; border: 0; background: transparent; text-align: left; padding: 6px 8px; gap: 6px; }
.mods button.on { background: var(--accent-bg); color: var(--accent); }
.mods .c { margin-left: auto; color: var(--muted); font-size: 11px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.layer-tabs { margin-bottom: 12px; }
.row { border-bottom: 1px solid var(--border); padding: 8px 2px; }
.row:last-child { border-bottom: 0; }
.row .head { display: flex; gap: 8px; align-items: baseline; cursor: pointer; }
.row .name { font-weight: 600; }
.row .doc { color: var(--text); margin-top: 2px; }
.row .doc.missing { color: var(--warn); }
.row .head .acts { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
.row .detail { margin: 8px 0 2px; padding: 8px 10px; background: var(--panel-2); border-radius: 8px; font-size: 13px; line-height: 1.7; }
.row .detail .k { color: var(--muted); }
.row.hl { background: var(--accent-bg); }
.link { color: var(--accent); cursor: pointer; }
.file-h { margin: 16px 0 4px; font-size: 13px; color: var(--muted); }
.method { display: inline-block; min-width: 54px; font-size: 11px; font-weight: 700; color: var(--accent); }
.shape { margin: 6px 0 4px; }
.shape .shape-h { font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
.shape table { width: 100%; border-collapse: collapse; font-size: 12px; background: var(--panel); border-radius: 6px; }
.shape th, .shape td { border-bottom: 1px solid var(--border); padding: 4px 6px; text-align: left; vertical-align: top; }
.shape th { color: var(--muted); font-weight: 500; }
.shape .nest { margin-left: 16px; border-left: 2px solid var(--border); padding-left: 8px; }
.need-req { color: var(--modified); }
.fields { color: var(--muted); font-size: 11px; margin-top: 2px; word-break: break-all; }
.shape-bar { display: flex; gap: 6px; margin: 10px 0 4px; }
.shape-bar button.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
pre.ts { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; overflow-x: auto; line-height: 1.55; margin: 4px 0; white-space: pre; }
.rulecount { font-size: 11px; border-radius: 999px; padding: 0 7px; background: var(--modified-bg); color: var(--modified); }
.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 20; display: flex; justify-content: flex-end; }
.drawer { width: min(560px, 100%); height: 100%; background: var(--panel); padding: 18px; overflow: auto; box-shadow: -4px 0 18px rgba(0, 0, 0, .15); }
.drawer h2 { margin: 0 0 12px; font-size: 16px; display: flex; gap: 8px; align-items: center; }
.drawer label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
.drawer input[type=text], .drawer select { width: 100%; }
.drawer .bar { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.drawer .note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
.err { color: var(--danger); font-size: 12px; margin-top: 8px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 30; font-size: 13px; }
.panel { min-width: 0; }
.row .name { word-break: break-all; }
.mods .grp-h { font-size: 11px; color: var(--muted); padding: 6px 8px 2px; }
/* Relationship graph: a left-to-right mind map, page → API → functions → tables. */
.graph-bar { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.graph-bar label { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.mm { overflow: auto; padding: 6px 2px 24px; --line: var(--border); }
.mm-node { display: flex; align-items: center; }
.mm-kids { display: flex; flex-direction: column; gap: 10px; padding-left: 16px; position: relative; }
.mm-kids::before { content: ""; position: absolute; left: 0; top: 50%; width: 16px; border-top: 2px solid var(--line); }
.mm-kids > .mm-node { position: relative; padding-left: 16px; }
.mm-kids > .mm-node::before { content: ""; position: absolute; left: 0; top: 50%; width: 16px; border-top: 2px solid var(--line); }
.mm-kids > .mm-node::after { content: ""; position: absolute; left: 0; top: -5px; bottom: -5px; border-left: 2px solid var(--line); }
.mm-kids > .mm-node:first-child::after { top: 50%; }
.mm-kids > .mm-node:last-child::after { bottom: 50%; }
.mm-kids > .mm-node:only-child::after { display: none; }
.mm-card { flex-shrink: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; max-width: 300px; line-height: 1.45; }
.mm-card .sub { color: var(--muted); font-size: 11px; }
.mm-card.page { border-color: var(--accent); background: var(--accent-bg); }
.mm-card.api { width: 460px; max-width: 460px; border-left: 3px solid var(--accent); }
.mm-card.fn { border-left: 3px solid var(--confirm); }
.mm-card.table { border-left: 3px solid var(--done); }
.mm-card.table.write { border-left-color: var(--modified); }
.mm-card.dim { opacity: .65; }
.mm-part { margin-top: 6px; }
.mm-part-h { font-size: 11px; color: var(--muted); }
.ft { font-size: 12px; }
.ft-row { display: grid; grid-template-columns: minmax(80px, auto) 1fr; gap: 0 8px; padding: 1px 0; border-top: 1px dashed var(--border); }
.ft-row:first-child { border-top: 0; }
.ft-row .t { color: var(--muted); word-break: break-all; }
.ft-row .d { grid-column: 1 / -1; color: var(--muted); font-size: 11px; }
.ft-nest { grid-column: 1 / -1; margin: 2px 0 4px 6px; padding-left: 8px; border-left: 2px solid var(--border); }
.pop-chip { margin: 4px 4px 0 0; }
.popover { position: fixed; z-index: 25; width: min(520px, calc(100vw - 24px)); max-height: 70vh; overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; box-shadow: 0 8px 28px rgba(0, 0, 0, .18); }
@media (max-width: 760px) {
  .map { grid-template-columns: 1fr; }
  .mods { position: static; max-height: none; display: flex; overflow-x: auto; gap: 2px; }
  .mods button { width: auto; flex-shrink: 0; white-space: nowrap; }
  .mods .c { display: none; }
  .board { grid-template-columns: repeat(5, 240px); }
  .row .head { flex-wrap: wrap; }
}
</style>
</head>
<body>
<header>
  <h1>VibeDoc <span id="repo-name" class="repo-name"></span></h1>
  <div class="tabs"><button data-view="board" class="on">规则看板</button><button data-view="map">代码地图</button><button data-view="graph">关系图</button><button data-view="features">功能文档</button></div>
  <select id="module"><option value="">全部模块</option></select>
  <input id="search" type="search" placeholder="搜索" style="width:200px">
  <span class="spacer"></span>
  <span id="live" class="live">连接中…</span>
  <button id="new-rule" class="primary">新建规则</button>
  <button id="stop" title="停止后台服务；下次从 VibeDoc App 或命令行再启动">停止服务</button>
</header>
<main id="main"></main>
<script>
const TOKEN = "__BOARD_TOKEN__";
// Repository settings from vibedoc.config.json (name, document directories, whether the code map is on).
const CONFIG = "__BOARD_CONFIG__";
const LAYERS = { frontend: "前端", api: "API", backend: "后端", database: "数据库" };
const MAP_TABS = { ...LAYERS, structs: "结构体" };
const COLUMNS = [["new", "新提出"], ["confirm", "待你确认"], ["doing", "进行中"], ["modified", "已修改"], ["done", "已实现"]];
const STATUS = { new: "新提出", confirm: "待你确认", doing: "进行中", modified: "已修改", done: "已实现", parked: "搁置" };
const MOVES = { new: [["parked", "搁置"]], parked: [["new", "恢复"]], confirm: [["doing", "确认计划，开始做"], ["new", "退回"]] };
// Feature document statuses, in the order the summary shows them.
const FEATURE_STATUS = [["released", "已上线"], ["done", "已持久化"], ["doing", "开发中"], ["confirm", "待你确认"], ["modified", "已修改"], ["new", "新提出"], ["parked", "搁置"]];
const FSTATUS = Object.fromEntries(FEATURE_STATUS);

const savedMode = (() => { try { return localStorage.getItem("shapeMode"); } catch { return null; } })();
const saved = (k, fallback) => { try { return localStorage.getItem(k) ?? fallback; } catch { return fallback; } };
const remember = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const state = {
  shapeMode: savedMode === "ts" ? "ts" : "table", view: "board", module: "", layer: "", search: "", mapLayer: "api", open: new Set(), highlight: null, code: null, rules: [],
  // Code map: the selected group per tab; each layer is grouped its own way (see GROUPS).
  mapGroup: {},
  features: { modules: [], items: [] },
  feat: { module: saved("featModule", ""), status: "" },
  graph: { group: "", page: "", focus: null, bodies: saved("graphBodies", "inline"), shared: saved("graphShared", "0") === "1", allFns: saved("graphAllFns", "0") === "1" },
};

const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
};
const toast = (msg) => {
  const t = h("div", { class: "toast" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 2200);
};
async function api(method, path, data) {
  const res = await fetch(path, { method, headers: { "Content-Type": "application/json", "X-Board-Token": TOKEN }, body: data ? JSON.stringify(data) : undefined });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `请求失败（${res.status}）`);
  return json;
}
const firstPara = (s) => (s || "").split(/\n\s*\n/)[0].replace(/\n/g, " ");
const matches = (...texts) => !state.search || texts.some((t) => (t || "").toLowerCase().includes(state.search.toLowerCase()));
const modTitle = (id) => state.code?.modules.find((m) => m.id === id)?.title || id;

// ---------- data ----------
async function loadRules() {
  state.rules = (await (await fetch("/api/rules")).json()).items;
}
async function loadFeatures() {
  state.features = await (await fetch("/api/features")).json();
}
async function loadCode() {
  const data = await (await fetch("/api/codemap")).json();
  // Without a code map the server sends only the module list.
  for (const k of ["functions", "routes", "tables", "types", "frontendFiles", "frontendRoutes", "backends"]) data[k] ??= [];
  data.fnById = new Map(data.functions.map((f) => [f.id, f]));
  data.routeById = new Map(data.routes.map((r) => [r.id, r]));
  data.tableByKey = new Map(data.tables.map((t) => [t.key, t]));
  data.typeById = new Map(data.types.map((t) => [t.id, t]));
  data.handlers = new Set(data.routes.map((r) => r.handler).filter(Boolean));
  state.code = data;
  const sel = document.getElementById("module");
  const cur = sel.value;
  sel.replaceChildren(h("option", { value: "" }, "全部模块"), ...data.modules.map((m) => h("option", { value: m.id }, `${m.title}（${m.id}）`)));
  sel.value = cur;
}
const rulesFor = (target) => state.rules.filter((r) => r.target === target);

// ---------- grouping ----------
// Each layer is grouped its own way: frontend by app/page directory, API by first path segment,
// backend by the service (binary) that reaches it, structs by the file that declares them, tables by schema.
const NO_BACKEND = "（未接入任何后端）";
function frontGroup(file) {
  let m;
  if ((m = /^frontend\/main-frontend\/src\/pages\/([^/]+)\//.exec(file))) return m[1];
  if (/^frontend\/main-frontend\/src\/pages\/[^/]+$/.test(file)) return "pages";
  if (file.startsWith("frontend/main-frontend/")) return "main-frontend 公共";
  if ((m = /^frontend\/([^/]+)\//.exec(file))) return m[1] === "packages" ? "shared" : m[1];
  return "其他";
}
const apiGroup = (r) => `/${r.path.split("/")[1] || ""}`;
const backendGroups = (f) => (f.backends.length ? f.backends : [NO_BACKEND]);
function structGroup(file) {
  const crate = file.split("/")[1];
  const stem = file.split("/").pop().replace(/\.rs$/, "");
  return crate === "main-backend" ? stem : `${crate}/${stem}`;
}
const tableSchema = (key) => key.split(".")[0];
const isRouted = (f) => state.code.handlers.has(f.id);
const backendFns = () => state.code.functions.filter((f) => f.layer === "backend" || (f.layer === "api" && !isRouted(f)));
const repoFns = () => state.code.functions.filter((f) => f.layer === "database");
// [group, count] for a tab, sorted by name.
function groupsOf(layer) {
  const c = state.code;
  const count = new Map();
  const add = (g) => count.set(g, (count.get(g) || 0) + 1);
  if (layer === "frontend") c.frontendFiles.forEach((f) => add(frontGroup(f.file)));
  else if (layer === "api") c.routes.forEach((r) => add(apiGroup(r)));
  else if (layer === "backend") backendFns().forEach((f) => backendGroups(f).forEach(add));
  else if (layer === "structs") c.types.forEach((t) => add(structGroup(t.file)));
  else if (layer === "database") c.tables.forEach((t) => add(t.schema));
  return [...count].sort(([a], [b]) => (a === NO_BACKEND) - (b === NO_BACKEND) || a.localeCompare(b));
}
function currentGroup(layer) {
  const groups = groupsOf(layer);
  const cur = state.mapGroup[layer];
  if (groups.some(([g]) => g === cur)) return cur;
  // Start on the largest group.
  const first = ([...groups].sort((a, b) => b[1] - a[1])[0] || [""])[0];
  state.mapGroup[layer] = first;
  return first;
}

// ---------- target helpers ----------
function targetLabel(target) {
  if (!target || !state.code) return target;
  const [kind, ...rest] = target.split(":");
  const id = rest.join(":");
  if (kind === "fn") return state.code.fnById.get(id)?.key || id;
  if (kind === "type") return state.code.typeById.get(id)?.name || id;
  return id;
}
function targetPlace(target) {
  const [kind, ...rest] = target.split(":");
  const id = rest.join(":");
  const c = state.code;
  if (kind === "fn" && c.fnById.has(id)) {
    const f = c.fnById.get(id);
    const route = c.routes.find((r) => r.handler === id);
    if (route) return { layer: "api", group: apiGroup(route), key: `route:${route.id}` };
    if (f.layer === "database" && f.tables.length) return { layer: "database", group: tableSchema(f.tables[0].name), key: target };

// Minimal Markdown for the feature document: headings, paragraphs, lists, quotes, code fences, `code`, **bold**.
function mdInline(text) {
  const out = [];
  const re = /(`[^`]+`|\*\*[^*]+\*\*)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    out.push(m[0].startsWith("`") ? h("code", { class: "mono" }, m[0].slice(1, -1)) : h("strong", {}, m[0].slice(2, -2)));
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
function mdBlocks(text, heading3) {
  const lines = text.split("\n");
  const out = [];
  const special = /^(#{1,6}\s|>|```|\s*[-*]\s+|\s*\d+\.\s+)/;
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (line.startsWith("```")) {
      const buf = [];
      for (i++; i < lines.length && !lines[i].startsWith("```"); i++) buf.push(lines[i]);
      i++;
      out.push(h("pre", { class: "ts mono" }, buf.join("\n")));
      continue;
    }
    const hm = /^(#{1,6})\s+(.*)$/.exec(line);
    if (hm) { out.push(hm[1].length === 3 ? heading3(hm[2]) : h(`h${Math.min(hm[1].length + 1, 6)}`, { class: `doc-h${hm[1].length}` }, mdInline(hm[2]))); i++; continue; }
    const take = (test, strip) => { const buf = []; while (i < lines.length && test.test(lines[i])) buf.push(lines[i++].replace(strip, "")); return buf; };
    if (/^>\s?/.test(line)) { out.push(h("blockquote", {}, mdInline(take(/^>\s?/, /^>\s?/).join("\n")))); continue; }
    if (/^\s*[-*]\s+/.test(line)) { out.push(h("ul", {}, take(/^\s*[-*]\s+/, /^\s*[-*]\s+/).map((t) => h("li", {}, mdInline(t))))); continue; }
    if (/^\s*\d+\.\s+/.test(line)) { out.push(h("ol", {}, take(/^\s*\d+\.\s+/, /^\s*\d+\.\s+/).map((t) => h("li", {}, mdInline(t))))); continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !special.test(lines[i])) buf.push(lines[i++]);
    out.push(h("p", {}, mdInline(buf.join("\n"))));
  }
  return out;
}

  const side = h("div", { class: "mods" }, h("div", { class: "grp-h" }, "前端（按应用／页面目录）"), groups.map(([g]) => h("button", { class: g === group && !focus ? "on" : "", onclick: () => { state.graph.focus = null; set("group", g); } },
    h("span", { class: "mono" }, g), h("span", { class: "c" }, graphRoots(g).length))));
  const chips = focus ? h("div", { class: "chips" }, h("span", { class: "chip mono on" }, focus.label), h("button", { class: "chip", onclick: () => set("focus", null) }, "返回页面视图"))
    : h("div", { class: "chips" }, roots.map((r) => h("button", { class: `chip mono ${r.id === state.graph.page ? "on" : ""}`, title: r.sub, onclick: () => set("page", r.id) }, r.label)));
  const bar = h("div", { class: "graph-bar" },
    h("span", { class: "tabs" },
      h("button", { class: state.graph.bodies === "inline" ? "on" : "", onclick: () => set("bodies", "inline", "graphBodies") }, "数据体全部展开"),
      h("button", { class: state.graph.bodies === "popover" ? "on" : "", onclick: () => set("bodies", "popover", "graphBodies") }, "点击弹出数据体")),
    h("label", {}, h("input", { type: "checkbox", checked: state.graph.shared || null, onchange: (e) => set("shared", e.target.checked, "graphShared") }), "包含其他目录组件发出的请求"),
    h("label", {}, h("input", { type: "checkbox", checked: state.graph.allFns || null, onchange: (e) => set("allFns", e.target.checked, "graphAllFns") }), "显示不访问数据库的函数"));

  const tree = focus ? focus.tree : root ? pageTree(root) : h("div", { class: "empty" }, "这个分组没有页面");
  const info = h("div", { class: "empty", style: "padding:0 0 8px" }, focus ? focus.info : "页面 → 接口（含请求与响应数据体） → 处理函数及其调用链 → 读写的表。",
    state.graph.focus?.startsWith("table:") ? "" : "默认只沿通向数据库的调用展开；同一接口下重复出现的函数只展开一次。", "点名称跳到代码地图。");
  return [h("div", { class: "map" }, side, h("div", { class: "panel" }, chips, bar, info, focus?.up, tree))];
}

// ---------- shell ----------
function render() {
  document.querySelectorAll(".tabs button[data-view]").forEach((b) => b.classList.toggle("on", b.dataset.view === state.view));
  document.getElementById("module").style.display = state.view === "board" ? "" : "none";
  const main = document.getElementById("main");
  const y = window.scrollY;
  const newBtn = document.getElementById("new-rule");
  newBtn.textContent = state.view === "features" ? "提新功能" : "新建规则";
  main.replaceChildren(...(state.view === "board" ? renderBoard() : state.view === "graph" ? renderGraph() : state.view === "features" ? renderFeatures() : renderMap()));
  window.scrollTo(0, y);
}
document.getElementById("repo-name").textContent = CONFIG.name;
document.title = `VibeDoc · ${CONFIG.name}`;
if (!CONFIG.codemap) for (const v of ["map", "graph"]) document.querySelector(`.tabs button[data-view="${v}"]`).remove();
document.querySelectorAll(".tabs button[data-view]").forEach((b) => b.addEventListener("click", () => { state.view = b.dataset.view; state.highlight = null; render(); window.scrollTo(0, 0); }));
document.getElementById("module").addEventListener("change", (e) => { state.module = e.target.value; render(); });
let searchTimer;
document.getElementById("search").addEventListener("input", (e) => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { state.search = e.target.value.trim(); render(); }, 150); });
document.getElementById("new-rule").addEventListener("click", () => (state.view === "features" ? newFeature() : newRule()));
document.getElementById("stop").addEventListener("click", async () => {
  if (!confirm("停止 VibeDoc 服务？")) return;
  try { await api("POST", "/api/shutdown", {}); } catch {}
  document.getElementById("main").replaceChildren(h("div", { class: "empty", style: "padding:40px;text-align:center;font-size:14px" }, "服务已停止，可以关闭这个窗口。下次从 VibeDoc App 或 `vibedoc serve` 启动。"));
  document.getElementById("live").textContent = "已停止";
  document.getElementById("live").className = "live";
});

function connect() {
  const live = document.getElementById("live");
  const es = new EventSource("/api/events");
  es.onopen = () => { live.textContent = "实时同步"; live.className = "live ok"; };
  es.onerror = () => { if (live.textContent !== "已停止") { live.textContent = "连接断开，重连中…"; live.className = "live"; } };
  es.addEventListener("rules", async () => { await loadRules(); render(); });
  es.addEventListener("features", async () => {
    await loadFeatures();
    // Re-rendering would move the editor and drop the caret; a stale save is refused by version instead.
    const ed = state.feat.edit;
    if (ed && state.view === "features") {
      if (state.features.modules.find((m) => m.module === ed.module)?.version !== ed.version) toast("这篇文档刚被别处改过，保存时会提示冲突");
      return;
    }
    render();
  });
  es.addEventListener("code", async () => { await loadCode(); render(); toast("代码有变化，地图已更新"); });
}
(async () => {
  await Promise.all([loadRules(), loadFeatures(), loadCode()]);
  render();
  connect();
})();
</script>
</body>
</html>
